name: Build and test
run-name: Build and test from trigger ${{ github.event_name }}
on: [workflow_call, push, pull_request]

env:
  CI: true
  TZ: Europe/Oslo

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      packages: 'read'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@navikt'
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Test HTTP routes
        run: npm run test:http
      - name: Build with mock
        run: npm run build:mock
      - uses: cypress-io/github-action@0ed14f5d30c4ad6e5e8ffb6f57dbb69150137a3f # v7.4.10
        with:
          install: false
          start: npm run start:with:test
          wait-on: 'http://localhost:3100/sendinn/api/isAlive'
          config: video=false
          config-file: cypress.config.ts
      - name: Upload screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: cypress-screenshots
          path: ${{ github.workspace }}/cypress/screenshots/*
