name: Build, push, and deploy
on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**.md'
      - '**/**.md'
  workflow_call:

jobs:
  build-and-test:
    name: Test frontend
    uses: ./.github/workflows/test.yml

  build-and-push:
    name: Build and push Docker container for prod
    uses: ./.github/workflows/build-push.yml
    with:
      environment: prod
    secrets: inherit
    permissions:
      contents: 'read'
      id-token: 'write'
      packages: 'read'

  deploy-prod:
    name: Deploy to prod
    needs: [build-and-test, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nais/deploy/actions/deploy@427e29c94d911626a023a76f402f6dcae1f840b7 # v3
        env:
          DRY_RUN: false
          PRINT_PAYLOAD: true
          CLUSTER: prod-gcp
          RESOURCE: .nais/nais.yml
          VAR: app_version=${{ github.sha }},image=${{ needs.build-and-push.outputs.image }}
