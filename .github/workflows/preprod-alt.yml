name: Build, push, and deploy (preprod-alt)
on: workflow_call

jobs:
  build-and-test:
    name: Test frontend
    uses: ./.github/workflows/test.yml

  build-and-push:
    name: Build and push Docker container for preprod
    uses: ./.github/workflows/build-push.yml
    with:
      environment: preprod-alt
    secrets: inherit
    permissions:
      contents: 'read'
      id-token: 'write'
      packages: 'read'

  deploy-preprod:
    name: Deploy to preprod-alt
    needs: [build-and-test, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nais/deploy/actions/deploy@427e29c94d911626a023a76f402f6dcae1f840b7 # v3
        env:
          DRY_RUN: false
          PRINT_PAYLOAD: true
          CLUSTER: dev-gcp
          RESOURCE: .nais/nais-preprod-alt.yml
          VAR: app_version=${{ github.sha }},image=${{ needs.build-and-push.outputs.image }}
